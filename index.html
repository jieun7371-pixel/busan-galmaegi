<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브코딩으로 만든 게임 (지은쌤)</title>
<meta name="description" content="바이브코딩으로 만든 게임 모음. 하고 싶은 게임을 골라 바로 시작해 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --ink: #16233b;
    --muted: #5d6b82;
    --line: #dde3ee;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --sky-a: #bfdbfe;
    --sky-b: #eff6ff;
    --bld: #8aa0c4;
    --bld-dark: #6b83ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1624;
      --surface: #182236;
      --ink: #eef2fa;
      --muted: #9aa8c2;
      --line: #28344d;
      --accent: #5b8def;
      --accent-ink: #0b1220;
      --sky-a: #27406f;
      --sky-b: #1b2c4d;
      --bld: #3d5584;
      --bld-dark: #314672;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 56px 24px 72px; }
  header { margin-bottom: 40px; }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.9rem, 5vw, 3rem);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 34em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
  }
  a.card { transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-3px); }
  a.card:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .thumb { height: 150px; background: linear-gradient(var(--sky-a), var(--sky-b)); }
  .thumb svg { display: block; width: 100%; height: 100%; }

  .body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .body p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
  .tag {
    align-self: flex-start;
    font-size: .8rem;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .btn {
    margin-top: 6px;
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    border-radius: 10px;
    padding: 9px 18px;
  }

  .soon {
    border: 2px dashed var(--line);
    background: transparent;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 300px;
    padding: 24px;
    color: var(--muted);
  }
  .soon strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

  footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>바이브코딩으로 만든 게임<br>(지은쌤)</h1>
    <p>하고 싶은 게임을 골라 바로 시작해 보세요. 게임을 시작하면 카메라 허용 창이 나타날 수 있어요.</p>
  </header>

  <main class="grid">
    <!-- 게임 카드: 새 게임이 생기면 아래 a.card 블록을 복사해서 붙여넣고
         href(폴더 이름), 제목, 설명만 바꾸세요. -->
    <a class="card" href="./galmaegi/">
      <div class="thumb" aria-hidden="true">
        <svg viewBox="0 0 280 150" preserveAspectRatio="xMidYMax slice">
          <rect x="20" y="70" width="40" height="80" fill="var(--bld)"/>
          <rect x="70" y="40" width="46" height="110" fill="var(--bld-dark)"/>
          <rect x="126" y="85" width="38" height="65" fill="var(--bld)"/>
          <rect x="174" y="55" width="50" height="95" fill="var(--bld-dark)"/>
          <rect x="232" y="90" width="36" height="60" fill="var(--bld)"/>
          <path d="M112 40 q18 -22 36 -4 q18 -18 36 4 q-18 -6 -36 6 q-18 -12 -36 -6z" fill="#fff"/>
        </svg>
      </div>
      <div class="body">
        <span class="tag">웹캠 · 마우스 · 터치</span>
        <h2>부산 갈매기: 새우깡 사냥</h2>
        <p>부산 도심 하늘을 나는 갈매기가 되어 60초 동안 새우깡을 모아 보세요. 고개를 기울이고 팔을 펄럭이면 방향이 바뀌고, 웹캠이 없으면 마우스로도 할 수 있어요.</p>
        <span class="btn">게임 시작</span>
      </div>
    </a>

    <div class="card soon">
      <div>
        <strong>다음 게임을 준비하고 있어요</strong>
        새 게임이 생기면 여기에 추가됩니다.
      </div>
    </div>
  </main>

  <footer>© 지은쌤</footer>
</div>
</body>
</html>
